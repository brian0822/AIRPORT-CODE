<style>
  :root{
    --bg:#0b0f16;
    --board:#141c28;
    --board-edge:#232f40;
    --amber:#f5a623;
    --amber-dim:#8a6423;
    --cyan:#5fd4e0;
    --text:#e9edf3;
    --muted:#6f7c8f;
    --good:#57c26a;
    --bad:#e0605a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #16202f 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, #101a26 0%, transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans TC','Barlow Condensed',sans-serif;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .mono{font-family:'Space Mono',monospace;}
  .cond{font-family:'Barlow Condensed',sans-serif;}

  /* ---- Header ---- */
  header{
    border-bottom:1px solid var(--board-edge);
    background:linear-gradient(180deg,#0f1520,#0b0f16);
    padding:22px 20px 18px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:3px;
    background:repeating-linear-gradient(90deg,var(--amber) 0 14px, transparent 14px 24px);
    opacity:.55;
  }
  .hdr-row{display:flex; align-items:baseline; justify-content:space-between; max-width:920px; margin:0 auto; flex-wrap:wrap; gap:8px;}
  .brand{display:flex; align-items:baseline; gap:12px;}
  .brand .tag{
    font-family:'Barlow Condensed'; font-weight:700; font-size:11px; letter-spacing:.28em;
    color:var(--amber); border:1px solid var(--amber-dim); padding:3px 8px; border-radius:2px;
  }
  h1{
    font-family:'Barlow Condensed'; font-weight:700; font-size:28px; letter-spacing:.03em;
    margin:0; color:var(--text);
  }
  .clock{font-family:'Space Mono'; color:var(--cyan); font-size:14px; letter-spacing:.05em;}
  .subtitle{max-width:920px;margin:6px auto 0; color:var(--muted); font-size:13.5px;}

  main{max-width:920px; margin:0 auto; padding:0 20px;}

  /* ---- Control panel ---- */
  .panel{
    margin-top:22px; background:var(--board); border:1px solid var(--board-edge);
    border-radius:6px; padding:16px 18px;
  }
  .panel-title{
    font-family:'Barlow Condensed'; font-weight:600; font-size:12px; letter-spacing:.18em;
    color:var(--muted); text-transform:uppercase; margin:0 0 10px;
  }
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    font-family:'Barlow Condensed'; font-weight:600; font-size:14px; letter-spacing:.02em;
    padding:7px 13px; border-radius:20px; border:1px solid var(--board-edge); background:#0f1520;
    color:var(--muted); cursor:pointer; user-select:none; transition:.15s;
  }
  .chip:hover{border-color:var(--amber-dim); color:var(--text);}
  .chip.active{background:rgba(245,166,35,.12); border-color:var(--amber); color:var(--amber);}
  .row-split{display:flex; gap:22px; flex-wrap:wrap; margin-top:14px;}
  .subgroup{flex:1; min-width:220px;}

  /* ---- Mode tabs ---- */
  .modes{display:flex; gap:10px; margin-top:18px;}
  .mode-btn{
    flex:1; text-align:center; padding:12px 10px; border-radius:6px;
    border:1px solid var(--board-edge); background:var(--board);
    font-family:'Barlow Condensed'; font-weight:700; font-size:16px; letter-spacing:.04em;
    color:var(--muted); cursor:pointer; transition:.15s;
  }
  .mode-btn.active{ border-color:var(--amber); color:var(--amber); background:rgba(245,166,35,.08);}

  .stat-strip{
    display:flex; gap:18px; margin-top:14px; padding:10px 4px; flex-wrap:wrap;
    font-family:'Space Mono'; font-size:12.5px; color:var(--muted);
  }
  .stat-strip b{color:var(--text); font-weight:700;}

  /* ---- Flashcard ---- */
  .stage{margin-top:22px; display:flex; flex-direction:column; align-items:center;}
  .empty-msg{color:var(--muted); text-align:center; padding:60px 20px; font-size:14px;}

  .flip-wrap{ width:100%; max-width:520px; perspective:1400px; }
  .flip-card{
    position:relative; width:100%; height:260px; cursor:pointer;
    transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .flip-card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:10px; border:1px solid var(--board-edge);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#182130,#111826);
    box-shadow:0 12px 30px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.02);
    padding:20px;
  }
  .face.back{transform:rotateY(180deg);}
  .region-badge{
    position:absolute; top:14px; left:16px; font-family:'Barlow Condensed'; font-weight:700;
    font-size:11px; letter-spacing:.2em; color:var(--muted); text-transform:uppercase;
  }
  .tap-hint{position:absolute; bottom:12px; right:16px; font-size:11px; color:var(--muted); font-family:'Space Mono';}
  .city-zh{font-family:'Barlow Condensed'; font-weight:700; font-size:44px; text-align:center; line-height:1.15;}
  .city-en{font-family:'Space Mono'; color:var(--cyan); font-size:14px; margin-top:8px; letter-spacing:.03em;}

  .code-block{display:flex; gap:36px; margin-top:4px;}
  .code-unit{text-align:center;}
  .code-label{font-family:'Barlow Condensed'; font-size:11px; letter-spacing:.25em; color:var(--muted); margin-bottom:6px;}
  .flap-letters{display:flex; gap:4px;}
  .flap{
    width:34px; height:44px; background:#0c1119; border:1px solid var(--board-edge); border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono'; font-weight:700; font-size:22px; color:var(--amber);
    box-shadow: inset 0 -1px 0 rgba(255,255,255,.05);
    opacity:0; transform:translateY(6px) rotateX(45deg); transition:opacity .28s, transform .28s;
  }
  .flap.show{opacity:1; transform:translateY(0) rotateX(0);}
  .flap::after{content:""; position:absolute; width:34px; height:1px; background:rgba(0,0,0,.5); }

  .rate-row{display:flex; gap:12px; margin-top:22px; width:100%; max-width:520px;}
  .rate-btn{
    flex:1; padding:13px; border-radius:6px; border:1px solid var(--board-edge); background:var(--board);
    font-family:'Barlow Condensed'; font-weight:700; font-size:15px; letter-spacing:.03em; cursor:pointer; color:var(--text);
  }
  .rate-btn.no{color:var(--bad); border-color:#4a2825;}
  .rate-btn.no:hover{background:rgba(224,96,90,.1);}
  .rate-btn.yes{color:var(--good); border-color:#254a30;}
  .rate-btn.yes:hover{background:rgba(87,194,106,.1);}
  .nav-row{display:flex; justify-content:space-between; width:100%; max-width:520px; margin-top:10px;}
  .ghost-btn{background:none; border:none; color:var(--muted); font-family:'Space Mono'; font-size:12px; cursor:pointer; padding:6px;}
  .ghost-btn:hover{color:var(--amber);}

  /* ---- Quiz ---- */
  .quiz-card{
    width:100%; max-width:520px; background:linear-gradient(180deg,#182130,#111826);
    border:1px solid var(--board-edge); border-radius:10px; padding:26px 22px;
  }
  .quiz-prompt{text-align:center;}
  .quiz-prompt .lbl{font-family:'Barlow Condensed'; font-size:12px; letter-spacing:.22em; color:var(--muted);}
  .quiz-prompt .city-zh{margin-top:8px;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px;}
  .opt{
    padding:14px 10px; border-radius:6px; border:1px solid var(--board-edge); background:#0f1520;
    font-family:'Space Mono'; font-size:17px; letter-spacing:.04em; text-align:center; cursor:pointer; color:var(--text);
  }
  .opt:hover{border-color:var(--amber-dim);}
  .opt.correct{border-color:var(--good); background:rgba(87,194,106,.12); color:var(--good);}
  .opt.wrong{border-color:var(--bad); background:rgba(224,96,90,.12); color:var(--bad);}
  .opt[disabled]{cursor:default;}
  .quiz-footer{display:flex; justify-content:space-between; align-items:center; margin-top:18px;}
  .next-btn{
    padding:10px 20px; border-radius:6px; background:var(--amber); color:#12160f; border:none;
    font-family:'Barlow Condensed'; font-weight:700; font-size:14px; letter-spacing:.03em; cursor:pointer;
    opacity:0; pointer-events:none; transition:.2s;
  }
  .next-btn.show{opacity:1; pointer-events:auto;}
  .streak{font-family:'Space Mono'; font-size:12px; color:var(--muted);}

  footer{max-width:920px; margin:34px auto 0; padding:0 20px; color:var(--muted); font-size:11.5px; text-align:center; font-family:'Space Mono';}

  @media (max-width:520px){
    .city-zh{font-size:34px;}
    .code-block{gap:20px;}
    .flap{width:26px; height:36px; font-size:17px;}
    .options{grid-template-columns:1fr;}
  }
</style>
</head>

<header>
  <div class="hdr-row">
    <div class="brand">
      <span class="tag">DEP</span>
      <h1>地名代字記憶站</h1>
    </div>

  </div>
  <div class="subtitle">機場城市代碼練習 · IATA / ICAO</div>
</header>

<main>

    <div class="row-split">

          <div class="chip" data-field="icao">ICAO</div>
          <div class="chip" data-field="both">兩者皆考</div>
        </div>
      </div>
      <div class="subgroup">
        <p class="panel-title">出題方向（選擇題模式）</p>
        <div class="chips" id="dirChips">
          <div class="chip active" data-dir="c2i">看地名 → 猜代碼</div>
          <div class="chip" data-dir="i2c">看代碼 → 猜地名</div>
          <div class="chip" data-dir="mix">混合出題</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modes">
    <div class="mode-btn active" data-mode="flash">字卡模式</div>
    <div class="mode-btn" data-mode="quiz">選擇題模式</div>
  </div>

  <div class="stat-strip" id="statStrip"></div>

  <div class="stage" id="stage"></div>
</main>

<footer>資料來源：使用者上傳之地名代字對照表 &middot; KTI／VDTI 為柬埔寨新啟用之德崇國際機場（金邊）</footer>

function fieldLabel(f){ return f === "i" ? "IATA" : "ICAO"; }

function rebuildPool(){
  state.pool = DATA.filter(d => state.regions.has(d.r));
  shuffle(state.pool);
  state.idx = 0;
  state.flipped = false;
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

// ---------------- Rendering ----------------
const stage = document.getElementById("stage");
const statStrip = document.getElementById("statStrip");

function renderChips(){
  const rc = document.getElementById("regionChips");
  rc.innerHTML = "";
  REGIONS.forEach(r=>{
    const el = document.createElement("div");
    el.className = "chip" + (state.regions.has(r) ? " active" : "");
    el.textContent = r;
    el.onclick = ()=>{
      if(state.regions.has(r)){
        if(state.regions.size>1) state.regions.delete(r);
      } else {
        state.regions.add(r);
      }
      renderChips();
      rebuildPool();
      render();
    };
    rc.appendChild(el);
  });
}

document.getElementById("fieldChips").addEventListener("click",(e)=>{
  const chip = e.target.closest(".chip");
  if(!chip) return;
  [...document.getElementById("fieldChips").children].forEach(c=>c.classList.remove("active"));
  chip.classList.add("active");
  state.field = chip.dataset.field;
  if(state.mode === "quiz") newQuizQuestion();
  render();
});

document.getElementById("dirChips").addEventListener("click",(e)=>{
  const chip = e.target.closest(".chip");
  if(!chip) return;
  [...document.getElementById("dirChips").children].forEach(c=>c.classList.remove("active"));
  chip.classList.add("active");
  state.dir = chip.dataset.dir;
  if(state.mode === "quiz") newQuizQuestion();
  render();
});

document.querySelectorAll(".mode-btn").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.mode = btn.dataset.mode;
    if(state.mode === "quiz") newQuizQuestion();
    render();
  };
});

function renderStats(){
  if(state.mode === "flash"){
    statStrip.innerHTML =
      `<span>字卡進度 <b>${state.pool.length ? state.idx+1 : 0}/${state.pool.length}</b></span>` +
      `<span>熟悉 <b style="color:var(--good)">${state.known}</b></span>` +
      `<span>不熟 <b style="color:var(--bad)">${state.unknown}</b></span>`;
  } else {
    const pct = state.quizTotal ? Math.round(state.quizScore/state.quizTotal*100) : 0;
    statStrip.innerHTML =
      `<span>答對 <b style="color:var(--good)">${state.quizScore}</b> / ${state.quizTotal}</span>` +
      `<span>正確率 <b>${pct}%</b></span>`;
  }
}

function render(){
  renderStats();
  if(state.pool.length === 0){
    stage.innerHTML = `<div class="empty-msg">請至少選擇一個地區</div>`;
    return;
  }
  if(state.mode === "flash") renderFlash();
  else renderQuiz();
}

// ---------- Flashcard mode ----------
function renderFlash(){
  const item = state.pool[state.idx];
  stage.innerHTML = `
    <div class="flip-wrap">
      <div class="flip-card ${state.flipped ? 'flipped':''}" id="flipCard">
        <div class="face front">
          <div class="region-badge">${item.r}</div>
          <div class="city-zh">${item.zh}</div>
          <div class="city-en">${item.en}</div>
          <div class="tap-hint">點卡片翻面 ▸</div>
        </div>
        <div class="face back">
          <div class="region-badge">${item.r}</div>
          <div class="code-block">
            <div class="code-unit">
              <div class="code-label">IATA</div>
              <div class="flap-letters" id="iataFlaps"></div>
            </div>
            <div class="code-unit">
              <div class="code-label">ICAO</div>
              <div class="flap-letters" id="icaoFlaps"></div>
            </div>
          </div>
          <div class="tap-hint">點卡片翻回 ▸</div>
        </div>
      </div>
    </div>
    <div class="rate-row">
      <div class="rate-btn no" id="btnNo">✕ 不熟</div>
      <div class="rate-btn yes" id="btnYes">✓ 熟悉</div>
    </div>
    <div class="nav-row">
      <div class="ghost-btn" id="prevBtn">‹ 上一張</div>
      <div class="ghost-btn" id="shuffleBtn">重新洗牌</div>
      <div class="ghost-btn" id="nextBtn">下一張 ›</div>
    </div>
  `;
  const card = document.getElementById("flipCard");
  card.onclick = ()=>{
    state.flipped = !state.flipped;
    card.classList.toggle("flipped");
    if(state.flipped) staggerFlaps(item);
  };
  document.getElementById("btnYes").onclick = (e)=>{ e.stopPropagation(); state.known++; advance(); };
  document.getElementById("btnNo").onclick = (e)=>{ e.stopPropagation(); state.unknown++; advance(); };
  document.getElementById("nextBtn").onclick = ()=> advance();
  document.getElementById("prevBtn").onclick = ()=>{
    state.idx = (state.idx - 1 + state.pool.length) % state.pool.length;
    state.flipped = false;
    render();
  };
  document.getElementById("shuffleBtn").onclick = ()=>{
    shuffle(state.pool);
    state.idx = 0;
    state.flipped = false;
    render();
  };
}
function advance(){
  state.idx = (state.idx + 1) % state.pool.length;
  state.flipped = false;
  render();
}
function staggerFlaps(item){
  buildFlaps("iataFlaps", item.i);
  buildFlaps("icaoFlaps", item.o);
}
function buildFlaps(containerId, code){
  const c = document.getElementById(containerId);
  c.innerHTML = "";
  [...code].forEach((ch,i)=>{
    const f = document.createElement("div");
    f.className = "flap";
    f.textContent = ch;
    c.appendChild(f);
    setTimeout(()=>f.classList.add("show"), 60*i);
  });
}

// ---------- Quiz mode ----------
let currentQuiz = null;
function activeDir(){
  if(state.dir === "mix") return Math.random() < 0.5 ? "c2i" : "i2c";
  return state.dir;
}
function newQuizQuestion(){
  if(state.pool.length === 0) return;
  const idx = Math.floor(Math.random()*state.pool.length);
  const item = state.pool[idx];
  const f = activeField();
  const dir = activeDir();

  if(dir === "c2i"){
    // show city, guess code
    const correct = item[f];
    const wrongPool = DATA.filter(d => d[f] !== correct);
    shuffle(wrongPool);
    const opts = [correct, ...wrongPool.slice(0,3).map(d=>d[f])];
    shuffle(opts);
    currentQuiz = { item, field:f, dir, correct, opts };
  } else {
    // show code, guess city
    const code = item[f];
    const correct = item.zh;
    const wrongPool = DATA.filter(d => d.zh !== correct);
    shuffle(wrongPool);
    const opts = [correct, ...wrongPool.slice(0,3).map(d=>d.zh)];
    shuffle(opts);
    currentQuiz = { item, field:f, dir, code, correct, opts };
  }
  state.quizAnswered = false;
}
function renderQuiz(){
  if(!currentQuiz) newQuizQuestion();
  const { item, field, dir, correct, opts, code } = currentQuiz;
  const promptHtml = dir === "c2i"
    ? `
      <div class="lbl">${item.r} &middot; 這個城市的 ${fieldLabel(field)} 代碼是？</div>
      <div class="city-zh">${item.zh}</div>
    `
    : `
      <div class="lbl">${item.r} &middot; 這個 ${fieldLabel(field)} 代碼是哪個地方？</div>
      <div class="city-zh mono">${code}</div>
    `;
  stage.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-prompt">${promptHtml}</div>
      <div class="options" id="optWrap"></div>
      <div class="quiz-footer">
        <div class="streak">已作答 ${state.quizTotal} 題</div>
        <button class="next-btn" id="nextQ">下一題 ›</button>
      </div>
    </div>
  `;
  const wrap = document.getElementById("optWrap");
  opts.forEach(opt=>{
    const b = document.createElement("div");
    b.className = "opt" + (dir === "c2i" ? " mono" : "");
    b.textContent = opt;
    b.onclick = ()=> answerQuiz(opt, b);
    wrap.appendChild(b);
  });
}
function answerQuiz(choice, el){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { correct } = currentQuiz;
  state.quizTotal++;
  const allOpts = [...document.querySelectorAll(".opt")];
  allOpts.forEach(o=>o.setAttribute("disabled","true"));
  if(choice === correct){
    state.quizScore++;
    el.classList.add("correct");
  } else {
    el.classList.add("wrong");
    allOpts.find(o=>o.textContent===correct)?.classList.add("correct");
  }
  document.getElementById("nextQ").classList.add("show");
  document.getElementById("nextQ").onclick = ()=>{
    newQuizQuestion();
    render();
  };
  renderStats();
}

// ---------------- Clock ----------------
function tickClock(){
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString('zh-TW',{hour12:false});
}
setInterval(tickClock, 1000);
tickClock();

// ---------------- Init ----------------
renderChips();
rebuildPool();
render();
</script>
</body>
</html>
